name: Prepare Notion Formula SDK
description: Build and cache the pinned Rust/WASM package before installing AppFlowy dependencies.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: sdk
      with:
        path: .notion-formula-sdk
        key: notion-formula-sdk-${{ runner.os }}-${{ hashFiles('scripts/notion-formula-source.json', 'scripts/prepare-notion-formula.mjs', '.github/actions/setup-notion-formula/action.yml') }}
    - uses: dtolnay/rust-toolchain@stable
      if: steps.sdk.outputs.cache-hit != 'true'
      with:
        toolchain: '1.95.0'
        targets: wasm32-unknown-unknown
    - uses: jetli/wasm-pack-action@v0.4.0
      if: steps.sdk.outputs.cache-hit != 'true'
      with:
        version: 'v0.12.1'
    - uses: pnpm/action-setup@v4
      if: steps.sdk.outputs.cache-hit != 'true'
      with:
        version: '10.9.0'
    - name: Build the pinned SDK
      if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/prepare-notion-formula.mjs
    - name: Verify packaged entry points
      shell: bash
      run: |
        test -s .notion-formula-sdk/dist/client.js
        test -s .notion-formula-sdk/dist/client.d.ts
        test -s .notion-formula-sdk/dist/worker.js
        test -s .notion-formula-sdk/dist/wasm/analyzer_wasm_bg.wasm
